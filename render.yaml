# The daily scout run lives in .github/workflows/scout-daily.yml (free GitHub Actions), not here.
services:
  - type: web
    name: scout-dashboard
    runtime: python
    plan: free                     # sleeps after 15 min idle; first load ~30–60 s. Upgrade to starter to keep it warm.
    region: frankfurt
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn scout.web.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_TOKEN       # long random string; you type it once per browser
        sync: false
      - fromGroup: scout-shared

envVarGroups:
  - name: scout-shared
    envVars:
      - key: SCOUT_PHASE
        value: foundation
      # Shown on the dashboard as today's limit. Keep it equal to the GitHub repo variable
      # SCOUT_DAILY_BUDGET_EUR that the daily run uses (raise both to "3.00" on 2026-10-19).
      - key: SCOUT_DAILY_BUDGET_EUR
        value: "1.00"
      - key: SCOUT_TIMEZONE
        value: Europe/Belgrade
