[project]
name = "kosovo-gap-scout"
version = "0.1.0"
description = "Daily AI scout that finds proven business models missing in Kosovo"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1,<2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "google-play-scraper>=1.2.7",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long strings/docstrings; ruff format still wraps code at 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "network: hits real external services (skipped by default)",
  "db: needs TEST_DATABASE_URL",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
