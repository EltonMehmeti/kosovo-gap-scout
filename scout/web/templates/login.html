{% extends "base.html" %}
{% import "_ui.html" as ui with context %}
{% set hide_nav = True %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="brand"><img class="mark" src="/static/favicon.svg?v={{ ASSET_VERSION }}" alt="" width="22" height="22"><span>Outlier</span></div>
  <p class="muted">Your daily scout for business gaps in Kosovo.</p>
  <form method="post" action="/login" class="form-stack">
    <label for="token">Dashboard token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
    <button class="btn primary block">Log in</button>
  </form>
</div>
{% endblock %}
